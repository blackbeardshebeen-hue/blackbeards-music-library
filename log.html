<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log — Blackbeard's Shebeen</title>
    <link rel="stylesheet" href="assets/theme.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon-64.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Blackbeard's Shebeen">
    <meta property="og:title" content="Captain's Log — Blackbeard's Shebeen">
    <meta property="og:description" content="Notes from the booth, one flag-raising at a time.">
    <meta property="og:url" content="https://blackbeardshebeen.com/log.html">
    <meta property="og:image" content="https://blackbeards-music-library.pages.dev/assets/og-image.png">
    <style>
        .log-header{text-align:center;padding:48px 0 28px}
        .log-header h1{font-size:2.2em;margin-bottom:8px}
        .log-header .subtitle{margin-bottom:6px}
        .log-header .tagline{color:rgba(255,255,255,.5);font-size:.9em}
        html.day .log-header .tagline{color:rgba(0,0,0,.45)}
        .log-list{display:flex;flex-direction:column;gap:16px;max-width:640px;margin:0 auto;padding:0 8px}
        .log-entry-full{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:22px 24px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
        .log-entry-full.visible{opacity:1;transform:translateY(0)}
        html.day .log-entry-full{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08)}
        .log-entry-full .log-date{font-size:.68em;color:var(--red-bright);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:10px}
        .log-entry-full .log-text{font-size:.92em;line-height:1.7;color:#ddd4d4;margin:0 0 10px}
        html.day .log-entry-full .log-text{color:#200a0a}
        .log-photo{display:block;width:100%;border-radius:10px;margin:10px 0;max-height:360px;object-fit:cover}
        .log-more,.log-link{font-size:.78em;color:var(--red-bright);text-decoration:none;border-bottom:1px solid rgba(230,57,70,.4)}
        .log-more:hover,.log-link:hover{border-color:var(--red-bright)}
        .log-edit-hint{text-align:center;font-size:.68em;color:rgba(255,255,255,.18);margin:24px 0 60px;letter-spacing:.5px}
        html.day .log-edit-hint{color:rgba(0,0,0,.18)}
        .log-back{text-align:center;margin-bottom:60px}
        .events-loading{text-align:center;padding:60px 20px;color:rgba(255,255,255,.25);font-size:.9em}
        .events-empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);max-width:640px;margin:0 auto}
        html.day .events-empty{color:rgba(0,0,0,.3)}
        .events-empty .skull{font-size:2.8em;display:block;margin-bottom:14px}
        .events-empty p{font-size:.9em;line-height:1.7}
    </style>
</head>
<body>

    <div class="flag-bg" aria-hidden="true">
        <img src="assets/jolly-roger-heart.jpg" alt="">
    </div>
    <button id="theme-toggle-btn" class="theme-toggle" title="Toggle day/night" aria-label="Toggle day and night theme">Day</button>
    <div class="container wide">
        <div class="log-header">
            <h1>Blackbeard's Shebeen</h1>
            <p class="subtitle">Captain's Log</p>
            <p class="tagline">Notes from the booth, one flag-raising at a time.</p>
        </div>
        <div id="log-root" class="log-list"><div class="events-loading">Loading the log…</div></div>
        <p class="log-edit-hint">⚝ Log managed via captains-log.txt in the GitHub repo</p>
        <div class="log-back page-actions">
            <a href="index.html" class="back-btn">&larr; Back to the Station</a>
        </div>
</div>
    <script src="assets/site.js"></script>
    <script src="assets/log.js?v=3"></script>
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"cf8e8fdf48e04f3580098a99d7e1c1ec"}'></script>
</body>
</html>
